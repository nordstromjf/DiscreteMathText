<article class="theorem theorem-like"><h2 class="heading">
<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">9.6.4</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Binomial Theorem.</span>
</h2>Let <span class="process-math">\(n\)</span> be a nonnegative integer, then<div class="displaymath process-math">
\begin{align*}
(a+b)^n&amp;= \binom{n}{0}a^n+\binom{n}{1}a^{n-1}b+\binom{n}{2}a^{n-2}b^{2}+\cdots +\binom{n}{n-1}ab^{n-1}+\binom{n}{n}b^n\\
&amp;=\sum_{k=0}^{n}\binom{n}{k}a^{n-k}b^k.
\end{align*}
</div>
