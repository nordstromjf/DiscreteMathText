<div class="para">An <dfn class="terminology"><span class="process-math">\(r\)</span>-permutation</dfn> of a set <span class="process-math">\(S\)</span> is an ordered selection of <span class="process-math">\(r\)</span> elements taken from the <span class="process-math">\(n\)</span> elements of <span class="process-math">\(S\)</span> in a row. We use the notation <span class="process-math">\(P(n, r)\)</span> for the number of <span class="process-math">\(r\)</span>-permutations from a set of <span class="process-math">\(n\)</span> elements.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#D_rpermutation-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
