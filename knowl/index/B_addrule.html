<article class="assemblage assemblage-like"><h2 class="heading"><span class="title">Addition Rule.</span></h2>
<div class="para logical">
<div class="para">If <span class="process-math">\(A\)</span> is the union of <span class="process-math">\(k\)</span> distinct, mutually disjoint sets, <span class="process-math">\(A_1, A_2, \ldots, A_k\text{,}\)</span> then the number of elements in <span class="process-math">\(A\)</span> is given by</div>
<div class="displaymath process-math">
\begin{equation*}
N(A)=N(A_1)+N(A_2)+\cdots +N(A_k).
\end{equation*}
</div>
