<div class="para logical">
<div class="para">Let <span class="process-math">\(R\)</span> be a relation on <span class="process-math">\(A\times B\text{.}\)</span> The  <dfn class="terminology">inverse relation</dfn>, <span class="process-math">\(R^{-1}\text{,}\)</span> on <span class="process-math">\(B\times A\)</span> is</div>
<div class="displaymath process-math">
\begin{equation*}
R^{-1}=\{(b, a)\in B\times A : (a, b)\in R\}.
\end{equation*}
</div>
