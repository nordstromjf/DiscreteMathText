</div> 
<div class="para">We say <span class="process-math">\(X\)</span> is the <dfn class="terminology">domain</dfn> and <span class="process-math">\(Y\)</span> is the <dfn class="terminology">codomain</dfn> of <span class="process-math">\(f\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#D_function-1-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
