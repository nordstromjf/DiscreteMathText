<h2 class="heading"><span class="type">Paragraph</span></h2>
<div class="para logical">
<div class="para">Just as we can add several terms of a sequence, the following notation allows us to multiply several terms of a sequence using <dfn class="terminology">product notation</dfn>:</div>
<div class="displaymath process-math">
\begin{equation*}
a_1\cdot a_2\cdot a_3\cdots a_n=\prod_{k=1}^{n}a_k.
\end{equation*}
</div>
