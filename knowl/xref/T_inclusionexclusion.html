<article class="theorem theorem-like"><h2 class="heading">
<span class="type">Theorem</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">9.3.4</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Inclusion-Exclusion Rule.</span>
</h2>
<div class="para logical">
<div class="para">Let <span class="process-math">\(A, B, C\)</span> be finite sets.</div>
<div class="displaymath process-math">
\begin{equation*}
N(A\cup B)=N(A)+N(B)-N(A\cap B).
\end{equation*}
</div>
<div class="displaymath process-math">
\begin{align*}
N(A\cup B\cup C)=&amp;N(A)+N(B)+N(C)\\
&amp; -N(A\cap B)-N(A\cap C)-N(B\cap C)\\
&amp; +N(A\cap B\cap C).
\end{align*}
</div>
