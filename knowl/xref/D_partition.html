</h2>
<div class="para logical">
<div class="para">A set of subsets of a set <span class="process-math">\(B\text{,}\)</span> <span class="process-math">\(\{A_1, A_2, \ldots, A_n\}\text{,}\)</span> is a <dfn class="terminology">partition</dfn> of <span class="process-math">\(B\)</span> if</div>
<ol class="decimal" id="D_partition-1-1-6">
<li>
<div class="para"><span class="process-math">\(\bigcup_{i=1}^nA_i=B\text{,}\)</span></div>
<div class="autopermalink" aria-hidden="true" data-description="Item 1"><a tabindex="-1" href="#D_partition-1-1-6-1" title="Copy heading and permalink for Item 1" aria-label="Copy heading and permalink for Item 1">🔗</a></div>
</li>
<li>
<div class="para">
<span class="process-math">\(A_i\cap A_j=\emptyset\)</span> whenever <span class="process-math">\(i\neq j\text{.}\)</span>
</div>
<div class="autopermalink" aria-hidden="true" data-description="Item 2"><a tabindex="-1" href="#D_partition-1-1-6-2" title="Copy heading and permalink for Item 2" aria-label="Copy heading and permalink for Item 2">🔗</a></div>
</li>
</ol>

</div>
